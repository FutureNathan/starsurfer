<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="STARSURFER">
  <title>STARSURFER</title>

  <!--
    A white star on black. Nothing else.

    The previous icon was a surfboard on the diagonal with a star on its nose,
    and at 16 pixels the board read as a grey smudge — two shapes was one too
    many. A favicon's whole job is to be found in a tab strip at a glance, and
    the highest-contrast, fastest-read version of this brand is its first
    syllable alone: one white star, emoji-plain, on pure black.

    The star is drawn with a round-joined stroke on top of its own fill, which
    is what fattens and softens the points the way the emoji glyph's do —
    a razor-tipped star loses its tips to antialiasing at tab size.

    public/apple-touch-icon.png is the same geometry rendered to PNG, because
    iOS will not take an SVG for a home-screen icon. Its control points are
    copied from this file — if one moves, both move.
  -->

  <rect width="100" height="100" rx="18" fill="#000000" />
  <path
    d="M 50 16
       L 61.17 38.63 L 86.14 42.26 L 68.07 59.87 L 72.34 84.74
       L 50 73 L 27.66 84.74 L 31.93 59.87 L 13.86 42.26
       L 38.83 38.63 Z"
    fill="#ffffff" stroke="#ffffff" stroke-width="7"
    stroke-linejoin="round" />
</svg>
